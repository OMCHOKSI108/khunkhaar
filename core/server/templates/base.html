<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}KHUNKHAAR QA{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card-bg: #070707;
      --card-border: #171717;
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --text-main: #f9fafb;
      --text-muted: #888888;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h1, h2, h3, .font-heading { font-family: 'Space Grotesk', sans-serif; }
    code, pre, .font-mono { font-family: 'JetBrains Mono', monospace; }
    header {
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #000000;
    }
    a { color: var(--accent); text-decoration: none; }
    .badge {
      display: inline-block; padding: 0.25rem 0.6rem; border-radius: 9999px;
      font-size: 0.75rem; font-weight: 600;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <a href="/" class="font-heading" style="font-size: 1.25rem; font-weight: 700; color: #fff;">
      🐺 KHUNKHAAR <span style="color: var(--accent); font-size: 0.85rem; font-family: 'JetBrains Mono';">QA</span>
    </a>
    <div>
      <span class="badge" style="background: rgba(16,185,129,0.15); color: #10b981; border: 1px solid #10b981;">● SYSTEM READY</span>
    </div>
  </header>
  <main style="flex: 1; padding: 2rem;">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
