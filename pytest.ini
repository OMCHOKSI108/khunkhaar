[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
addopts = -p no:cacheprovider
markers =
    browser: tests that launch a real browser engine
    api: tests that exercise the API Call Tool
    database: tests that exercise the DB Context Tool
    mcp: tests that start an MCP server over stdio
    security: property-based and security-invariant tests
