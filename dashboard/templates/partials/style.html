<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #0b1120; color: #e2e8f0; line-height: 1.5;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: #7dd3fc; text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { overflow-wrap: anywhere; word-break: break-word; }
  p, li { overflow-wrap: anywhere; }
  .top { background: #0f172a; border-bottom: 1px solid #1e293b; }
  .top-inner { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex;
               flex-wrap: wrap; gap: 10px 16px; align-items: center;
               justify-content: space-between; }
  .brand { color: #f8fafc; font-weight: 800; letter-spacing: .04em; }
  .brand span { color: #38bdf8; }
  nav { display: flex; flex-wrap: wrap; gap: 14px; }
  nav a { color: #cbd5e1; }
  .top-right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .badge { border: 1px solid #14532d; background: #052e16; color: #86efac; border-radius: 999px;
           padding: 1px 9px; font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px; }
  h1 { font-size: 1.55rem; margin: 0 0 4px; line-height: 1.25; overflow-wrap: anywhere; }
  h2 { font-size: 1.1rem; margin: 26px 0 8px; }
  h3 { font-size: .98rem; margin: 0 0 6px; }
  .muted { color: #94a3b8; font-size: .85rem; }
  .cards { display: grid; gap: 12px; margin: 12px 0;
           grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
  .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 14px;
          min-width: 0; }
  .metric { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .table-wrap { overflow-x: auto; max-width: 100%; border: 1px solid #1e293b;
                border-radius: 12px; margin: 10px 0; }
  table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #1e293b;
           white-space: nowrap; vertical-align: top; }
  td.wrap { white-space: normal; overflow-wrap: anywhere; min-width: 160px; }
  th { color: #94a3b8; font-weight: 600; background: #0f172a; }
  tr:last-child td { border-bottom: 0; }
  .bar-track { background: #1e293b; border-radius: 999px; height: 9px; overflow: hidden;
               min-width: 80px; }
  .bar { height: 100%; background: #38bdf8; }
  .tag { display: inline-block; border: 1px solid #334155; border-radius: 999px;
         padding: 1px 8px; font-size: .75rem; color: #cbd5e1; white-space: nowrap; }
  .tag.ok { border-color: #14532d; color: #86efac; }
  .tag.warn { border-color: #78350f; color: #fcd34d; }
  .tag.bad { border-color: #7f1d1d; color: #fca5a5; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .stack { display: flex; flex-direction: column; gap: 4px; }
  .gallery { display: grid; gap: 10px;
             grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); }
  .gallery img { max-width: 100%; height: auto; display: block; border-radius: 8px;
                 border: 1px solid #1e293b; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #0f172a;
        border: 1px solid #1e293b; border-radius: 10px; padding: 10px; font-size: .8rem;
        max-width: 100%; overflow-x: auto; }
  footer { padding-top: 8px; padding-bottom: 28px; }
  form { margin: 0; }
  button.link { background: none; border: 0; color: #7dd3fc; cursor: pointer; font: inherit;
                padding: 0; }
  button.link:hover { text-decoration: underline; }
  .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center;
                 padding: 20px; }
  .login-card { width: 100%; max-width: 420px; background: #0f172a; border: 1px solid #1e293b;
                border-radius: 14px; padding: 22px; }
  input[type=password] { width: 100%; padding: 10px 12px; border-radius: 8px;
                         border: 1px solid #334155; background: #020617; color: #e2e8f0;
                         font-size: 1rem; margin: 8px 0 14px; }
  button.primary { width: 100%; padding: 10px 14px; border: 0; border-radius: 8px;
                   background: #0ea5e9; color: #04121f; font-weight: 700; font-size: 1rem;
                   cursor: pointer; }
  .error { color: #fda4af; font-size: .9rem; }
  @media (max-width: 520px) {
    h1 { font-size: 1.3rem; }
    .wrap { padding: 14px 12px; }
    th, td { padding: 7px 8px; }
  }
</style>
